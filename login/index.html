<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — ilming</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://app.ilming.io/login" />
    <meta http-equiv="refresh" content="0; url=https://app.ilming.io/login" />
    <script src="/assets/js/config.js"></script>
    <script>
      (function () {
        var base =
          window.ILMING_SITE && window.ILMING_SITE.appUrl
            ? window.ILMING_SITE.appUrl
            : "https://app.ilming.io";
        location.replace(base.replace(/\/$/, "") + "/login");
      })();
    </script>
  </head>
  <body>
    <p><a href="https://app.ilming.io/login">Continue to log in</a></p>
  </body>
</html>
