<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="ilming">
  <defs>
    <linearGradient id="ilming-bg" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1829"/>
      <stop offset="1" stop-color="#0a6b5c"/>
    </linearGradient>
    <linearGradient id="ilming-page-left" x1="128" y1="280" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
