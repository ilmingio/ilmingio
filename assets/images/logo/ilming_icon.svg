  <path
    d="M256 262 C208 250 152 272 120 310 L120 392 C160 360 208 346 256 366 Z"
    fill="url(#ilming-page-left)"
  />
  <path
    d="M256 262 C304 250 360 272 392 310 L392 392 C352 360 304 346 256 366 Z"
